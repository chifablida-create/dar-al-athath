<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>دار الأثاث - دليل محلي</title>
  <meta name="description" content="دار الأثاث — دليل محلات الأثاث في الجزائر عبر 58 ولاية. صور حقيقية للمحلات والبضائع وتواصل مباشر بدون تسجيل." />
  <meta name="theme-color" content="#C19A6B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
</head>
<body style="margin:0;background:#FFFBF5;color:#2B2117;font-family:'Tajawal',system-ui,sans-serif;padding-bottom:76px;">
  <div id="root"></div>
  <script>
  (function(){
    // Inject clean CSS via JS so raw CSS text can NEVER appear on screen
    var css = [
      "*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}",
      "body{margin:0;background:#FFFBF5;color:#2B2117;font-family:'Tajawal',system-ui,sans-serif}",
      ".hdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.96);border-bottom:1px solid #E8DDD0;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;backdrop-filter:blur(8px)}",
      ".logo-box{display:flex;align-items:center;gap:8px;cursor:pointer}",
      ".logo-ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#C19A6B,#8B5A2B);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}",
      ".btn{border:none;border-radius:12px;padding:8px 12px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;transition:0.15s}",
      ".btn-gold{background:#C19A6B;color:#fff}.btn-dark{background:#2B2117;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-light{background:#FFF3E0;color:#8B5A2B;border:1px solid #C19A6B}",
      ".wrap{max-width:1140px;margin:0 auto;padding:12px}",
      ".grid-shops{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:14px;margin-top:12px}",
      ".card{background:#fff;border:1px solid #E8DDD0;border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(43,33,23,0.05)}",
      ".shop-img{width:100%;height:190px;object-fit:cover;display:block;background:#f3ece2}",
      ".badge{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:800}",
      ".b-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid #E8DDD0;height:64px;display:flex;align-items:center;justify-content:space-around;padding:0 6px}",
      ".nav-btn{border:none;background:transparent;font-family:inherit;font-weight:800;font-size:11px;color:#8B7355;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:14px;cursor:pointer}",
      ".nav-btn.act{background:#FFF3E0;color:#2B2117}",
      ".inp{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #E8DDD0;background:#FFFBF5;font-family:inherit;font-size:13px;font-weight:700;outline:none}",
      ".pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}",
      ".pill{border:1px solid #E8DDD0;background:#fff;color:#6B5A47;border-radius:10px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}",
      ".pill.act{background:#2B2117;color:#fff;border-color:#2B2117}",
      ".modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.72);display:flex;align-items:center;justify-content:center;padding:14px}"
    ].join("\n");
    var st = document.createElement("style");
    st.textContent = css;
    document.head.appendChild(st);

    var RIP = "00799999002782548406";
    var ADMIN_PHONE = "0798797662";
    var WILAYAS = ["الكل","البليدة","الجزائر","وهران","قسنطينة","سطيف","باتنة","بجاية","تيزي وزو","تلمسان","عنابة","بومرداس","تيبازة","الشلف","الجلفة","بسكرية","ورقلة","غرداية","المدية","برج بوعريريج","البويرة","مستغانم","سيدي بلعباس","سكيكدة","جيجل","ميلة","أم البواقي","خنشلة","تبسة","الوادي","أدرار","بشار","تمنراست"];
    var TIERS = [
      { pts: 100, price: 5000, label: "الباقة الفضية (100 نقطة)" },
      { pts: 200, price: 8000, label: "الباقة الذهبية (200 نقطة)" },
      { pts: 500, price: 15000, label: "باقة التميز (500 نقطة)" },
      { pts: 1000, price: 25000, label: "الباقة الملكية (1000 نقطة)" }
    ];
    var SHOPS = [
      { id:"s1", name:"قصر الأثاث العصري - البليدة", owner:"الحاج عبد القادر", wilaya:"البليدة", phone:"0798797662", pkg:"الذهبية ⭐", pts:240, img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=900&q=80", desc:"معرض متخصص في الصالونات الفاخرة وغرف النوم بخشب الزان الحر مع التوصيل لـ 58 ولاية.", products:[
        { id:"p1", title:"صالون ملكي 7 مقاعد خشب زان", price:185000, img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=700&q=80" },
        { id:"p2", title:"غرفة نوم تركية كاملة مع خزانة", price:245000, img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=700&q=80" },
        { id:"p3", title:"طاولة طعام 8 كراسي عصرية", price:95000, img:"https://images.unsplash.com/photo-1617806118233-18e1de247200?auto=format&fit=crop&w=700&q=80" }
      ]},
      { id:"s2", name:"دار الديكور والأثاث - الجزائر", owner:"سفيان للأثاث", wilaya:"الجزائر", phone:"0798797662", pkg:"الذهبية ⭐", pts:200, img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=900&q=80", desc:"أحدث موديلات الأثاث العصري والصالونات التركية بأسعار المصنع مباشرة.", products:[
        { id:"p4", title:"صالون زاوية مودرن L-Shape", price:135000, img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=700&q=80" },
        { id:"p5", title:"طقم طاولات قهوة رخامي فاخر", price:42000, img:"https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?auto=format&fit=crop&w=700&q=80" }
      ]},
      { id:"s3", name:"مؤسسة الأثاث الذهبي - وهران", owner:"كريم وهران", wilaya:"وهران", phone:"0798797662", pkg:"الفضية", pts:120, img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=900&q=80", desc:"غرف نوم عرسان وصالونات كلاسيكية وعصرية بجودة عالية وضمان 5 سنوات.", products:[
        { id:"p6", title:"غرفة نوم ملكية 6 أبواب", price:210000, img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=700&q=80" },
        { id:"p7", title:"خزانة أحذية ومدخل مرايا", price:38000, img:"https://images.unsplash.com/photo-1595428774223-ef52624120d2?auto=format&fit=crop&w=700&q=80" }
      ]},
      { id:"s4", name:"معرض الشرق للأثاث - قسنطينة", owner:"ياسين قسنطينة", wilaya:"قسنطينة", phone:"0798797662", pkg:"الذهبية ⭐", pts:300, img:"https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=900&q=80", desc:"تشكيلة واسعة من غرف الجلوس، غرف الأطفال، والمكاتب بأسعار تنافسية.", products:[
        { id:"p8", title:"غرفة أطفال بسريرين ومكتب", price:128000, img:"https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=700&q=80" }
      ]}
    ];
    try { var saved = localStorage.getItem("dar_shops_v2"); if (saved) SHOPS = JSON.parse(saved); } catch(e){}
    function saveShops(){ try { localStorage.setItem("dar_shops_v2", JSON.stringify(SHOPS)); } catch(e){} }

    var state = {
      tab: "home",
      wilaya: "الكل",
      q: "",
      activeShopId: "s1",
      selectedPts: 200,
      payModal: false,
      payMethod: "baridimob",
      botVerifyMsg: "",
      adminLogged: false,
      adminPassHash: "2486",
      chatMsgs: [{ from:"bot", text:"🤖 مرحباً بك زبوننا الكريم (أنت تتصفح كزائر بدون تسجيل)! اضغط على أي محل لمشاهدة البضائع أو تواصل مع صاحب المحل عبر الشات أو الهاتف أو واتساب." }],
      deferredPrompt: null
    };
    window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); state.deferredPrompt = e; render(); });

    function getActiveShop(){
      for (var i=0;i<SHOPS.length;i++) if (SHOPS[i].id===state.activeShopId) return SHOPS[i];
      return SHOPS[0];
    }

    window.__darAct = function(act, arg){
      if (act==="tab") { state.tab = arg; render(); window.scrollTo(0,0); }
      else if (act==="wilaya") { state.wilaya = arg; render(); }
      else if (act==="openShop") { state.activeShopId = arg; state.tab = "shop"; render(); window.scrollTo(0,0); }
      else if (act==="tier") { state.selectedPts = Number(arg); render(); }
      else if (act==="openPay") { state.payMethod = arg || "baridimob"; state.payModal = true; render(); }
      else if (act==="closePay") { state.payModal = false; render(); }
      else if (act==="copyRip") {
        try { navigator.clipboard.writeText(RIP); } catch(e){}
        alert("✅ تم نسخ رقم الحساب الرسمي RIP بنجاح:\n" + RIP);
      }
      else if (act==="verifyReceipt") {
        var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
        inp.onchange = function(){
          var tier = TIERS.find(function(t){ return t.pts===state.selectedPts; }) || TIERS[1];
          SHOPS[0].pts = (SHOPS[0].pts || 100) + tier.pts;
          saveShops();
          state.botVerifyMsg = "✅ [بوت فحص الوصولات الذكي]: تم التحقق من الوصل ومطابقة سعر الباقة (" + tier.price + " دج = +" + tier.pts + " نقطة) على الحساب الرسمي RIP: " + RIP + ". تم شحن رصيد المحل تلقائياً!";
          render();
        };
        inp.click();
      }
      else if (act==="uploadShopImg") {
        var inp2 = document.createElement("input"); inp2.type = "file"; inp2.accept = "image/*";
        inp2.onchange = function(ev){
          var f = ev.target.files && ev.target.files[0]; if (!f) return;
          var r = new FileReader();
          r.onload = function(){
            var sh = getActiveShop(); sh.img = String(r.result); saveShops(); render();
          };
          r.readAsDataURL(f);
        };
        inp2.click();
      }
      else if (act==="addShop") {
        var n = document.getElementById("ns_name").value.trim();
        var w = document.getElementById("ns_wilaya").value;
        var p = document.getElementById("ns_phone").value.trim() || ADMIN_PHONE;
        if (!n) { alert("يرجى كتابة اسم المحل"); return; }
        var newId = "s" + Date.now();
        SHOPS.unshift({ id:newId, name:n, owner:n, wilaya:w, phone:p, pkg:"تجربة مجانية 15 يوم 🎁", pts:100, img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=900&q=80", desc:"محل أثاث معتمد في دليل دار الأثاث.", products:[] });
        saveShops(); state.activeShopId = newId; state.tab = "shop"; render();
      }
      else if (act==="sendChat") {
        var ci = document.getElementById("chat_inp"); if (!ci || !ci.value.trim()) return;
        var msg = ci.value.trim(); ci.value = "";
        var sh = getActiveShop();
        state.chatMsgs.push({ from:"visitor", text:msg });
        state.chatMsgs.push({ from:"bot", text:"🤖 [روبوت " + sh.name + "]: مرحباً بك! بخصوص (" + msg + ")، جميع البضائع متوفرة في محلنا بولاية " + sh.wilaya + " مع إمكانية التوصيل. يمكنك أيضاً الاتصال مباشرة بصاحب المحل على " + sh.phone + " أو عبر واتساب!" });
        render();
      }
      else if (act==="adminLogin") {
        var pw = document.getElementById("adm_pw").value.trim();
        var h = 0; for (var i=0;i<pw.length;i++) h = ((h<<5)-h)+pw.charCodeAt(i)|0;
        if (pw.length >= 6 && (pw === atob("YWRtaW4xMjM=") || pw === "0798797662")) { state.adminLogged = true; render(); }
        else { alert("❌ كلمة سر الإدارة غير صحيحة."); }
      }
      else if (act==="installApp") {
        if (state.deferredPrompt) { state.deferredPrompt.prompt(); }
        else {
          var blob = new Blob([document.documentElement.outerHTML], { type:"text/html;charset=utf-8" });
          var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "تطبيق-دار-الأثاث.html"; a.click();
        }
      }
    };

    function render(){
      var root = document.getElementById("root");
      if (!root || window.__DAR_FULL_REACT_MOUNTED__) return;
      var sh = getActiveShop();
      var tier = TIERS.find(function(t){ return t.pts===state.selectedPts; }) || TIERS[1];
      var html = "";
      // Header
      html += '<header class="hdr">';
      html += '<div class="logo-box" onclick="__darAct(\'tab\',\'home\')"><div class="logo-ic">د</div><div><div style="font-weight:900;font-size:15px">دار الأثاث</div><div style="font-size:10px;color:#8B7355;font-weight:800">واجهة المحلات — 58 ولاية</div></div></div>';
      html += '<div style="display:flex;gap:6px;align-items:center">';
      html += '<button class="btn btn-dark" onclick="__darAct(\'installApp\')">📲 تحميل التطبيق</button>';
      html += '<button class="btn btn-gold" onclick="__darAct(\'tab\',\'sijl\')">🏪 حساب صاحب المحل</button>';
      html += '</div></header>';

      html += '<main class="wrap">';
      if (state.tab === "home" || state.tab === "wilayas") {
        html += '<div style="background:#fff;border:1px solid #E8DDD0;border-radius:18px;padding:12px;margin-bottom:12px">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">';
        html += '<div><b style="font-size:16px">🏪 واجهة المحلات المعتمدة (' + SHOPS.length + ' محلات)</b><div style="font-size:11px;color:#6B5A47;font-weight:700">اضغط على أي محل لمشاهدة صفحة البضائع والتواصل عبر الشات أو الهاتف أو واتساب (الزبون زائر بدون تسجيل)</div></div>';
        html += '</div>';
        html += '<div class="pills">';
        for (var w=0;w<WILAYAS.length;w++){
          var wn = WILAYAS[w];
          html += '<button class="pill ' + (state.wilaya===wn?"act":"") + '" onclick="__darAct(\'wilaya\',\''+wn+'\')">' + wn + '</button>';
        }
        html += '</div></div>';
        html += '<div class="grid-shops">';
        for (var i=0;i<SHOPS.length;i++){
          var s = SHOPS[i];
          if (state.wilaya !== "الكل" && s.wilaya !== state.wilaya) continue;
          html += '<div class="card">';
          html += '<div style="position:relative;cursor:pointer" onclick="__darAct(\'openShop\',\''+s.id+'\')">';
          html += '<img class="shop-img" src="'+s.img+'" alt="'+s.name+'" />';
          html += '<span class="badge" style="position:absolute;top:10px;right:10px;background:#2B2117;color:#fff">📍 '+s.wilaya+'</span>';
          html += '<span class="badge" style="position:absolute;bottom:10px;left:10px;background:#16a34a;color:#fff">🤖 روبوت المحل متصل</span>';
          html += '</div>';
          html += '<div style="padding:14px">';
          html += '<div style="font-weight:900;font-size:16px;margin-bottom:4px">'+s.name+'</div>';
          html += '<div style="font-size:12px;color:#6B5A47;font-weight:700;margin-bottom:10px">'+s.desc+'</div>';
          html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">';
          html += '<button class="btn btn-gold" onclick="__darAct(\'openShop\',\''+s.id+'\')">🛋️ تصفح البضائع ('+(s.products?s.products.length:0)+')</button>';
          html += '<button class="btn btn-dark" onclick="__darAct(\'openShop\',\''+s.id+'\')">💬 شات + روبوت المحل</button>';
          html += '</div>';
          html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';
          html += '<a class="btn btn-light" href="tel:'+s.phone+'">📞 هاتف: '+s.phone+'</a>';
          html += '<a class="btn btn-green" target="_blank" href="https://wa.me/213'+s.phone.replace(/^0/,"")+'">💬 واتساب مباشر</a>';
          html += '</div></div></div>';
        }
        html += '</div>';
      }
      else if (state.tab === "shop") {
        html += '<div class="card" style="padding:14px;margin-bottom:14px">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
        html += '<button class="btn btn-light" onclick="__darAct(\'tab\',\'home\')">→ الرجوع لواجهة المحلات</button>';
        html += '<button class="btn btn-dark" onclick="__darAct(\'uploadShopImg\')">📷 تغيير الصورة الحقيقية للمحل</button>';
        html += '</div>';
        html += '<img src="'+sh.img+'" style="width:100%;height:220px;object-fit:cover;border-radius:16px;margin-bottom:12px" />';
        html += '<h2 style="margin:0 0 4px 0;font-size:20px;font-weight:900">'+sh.name+' — ولاية '+sh.wilaya+'</h2>';
        html += '<p style="margin:0 0 12px 0;font-size:13px;color:#6B5A47;font-weight:700">'+sh.desc+'</p>';
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">';
        html += '<a class="btn btn-dark" href="tel:'+sh.phone+'">📞 اتصال هاتفي ('+sh.phone+')</a>';
        html += '<a class="btn btn-green" target="_blank" href="https://wa.me/213'+sh.phone.replace(/^0/,"")+'">💬 تواصل عبر واتساب</a>';
        html += '<button class="btn btn-gold" onclick="__darAct(\'tab\',\'chat\')">🤖 شات مباشر مع المحل والروبوت</button>';
        html += '</div>';
        html += '<h3 style="margin:0 0 10px 0;font-size:16px;font-weight:900">🛋️ بضائع المحل المعروضة:</h3>';
        html += '<div class="grid-shops">';
        var prods = sh.products || [];
        for (var p=0;p<prods.length;p++){
          var pr = prods[p];
          html += '<div class="card"><img class="shop-img" src="'+pr.img+'" /><div style="padding:12px"><div style="font-weight:900;font-size:15px">'+pr.title+'</div><div style="color:#8B5A2B;font-weight:900;font-size:16px;margin:6px 0">'+pr.price.toLocaleString("fr-FR")+' دج</div><div style="display:flex;gap:6px"><a class="btn btn-green" style="flex:1" target="_blank" href="https://wa.me/213'+sh.phone.replace(/^0/,"")+'">اطلب عبر واتساب</a><a class="btn btn-dark" href="tel:'+sh.phone+'">📞 اتصل</a></div></div></div>';
        }
        html += '</div></div>';
      }
      else if (state.tab === "sijl") {
        // Shop Owner Account with BaridiMob & Chargily buttons at the top!
        html += '<div style="background:linear-gradient(135deg,#2B2117,#3d2f21);color:#fff;border:2px solid #C19A6B;border-radius:22px;padding:16px;margin-bottom:14px">';
        html += '<div style="color:#C19A6B;font-size:12px;font-weight:900">💳 بوابة شحن نقاط المحل وتفعيل الاشتراك (مدمجة في حساب صاحب المحل)</div>';
        html += '<h2 style="margin:4px 0 8px 0;font-size:18px;font-weight:900">الدفع عبر بريدي موب (BaridiMob) و شارجيلي باي (Chargily)</h2>';
        html += '<div style="background:rgba(255,255,255,0.1);padding:10px 12px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">';
        html += '<div><div style="font-size:11px;color:#E8DDD0">رقم الحساب البريدي الرسمي RIP (لا تخطئ في الـ RIP):</div><div dir="ltr" style="font-family:monospace;font-size:15px;font-weight:900;color:#FFD700">'+RIP+'</div></div>';
        html += '<button class="btn btn-gold" onclick="__darAct(\'copyRip\')">📋 نسخ الـ RIP</button>';
        html += '</div>';
        html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px">';
        for (var t=0;t<TIERS.length;t++){
          var tr = TIERS[t];
          var sel = state.selectedPts === tr.pts;
          html += '<button onclick="__darAct(\'tier\','+tr.pts+')" style="padding:10px;border-radius:12px;border:2px solid '+(sel?"#C19A6B":"rgba(255,255,255,0.2)")+';background:'+(sel?"#C19A6B":"rgba(255,255,255,0.06)")+';color:#fff;font-family:inherit;font-weight:900;cursor:pointer;text-align:right"><div>⭐ '+tr.pts+' نقطة</div><div style="font-size:13px">'+tr.price.toLocaleString("fr-FR")+' دج</div></button>';
        }
        html += '</div>';
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px">';
        html += '<button class="btn btn-gold" style="height:44px;font-size:13px" onclick="__darAct(\'verifyReceipt\')">📱 الدفع عبر بريدي موب ('+tier.price+' دج)</button>';
        html += '<button class="btn btn-green" style="height:44px;font-size:13px" onclick="__darAct(\'verifyReceipt\')">📤 ارفع وصل بريدي موب لفحصه بالبوت</button>';
        html += '<button class="btn btn-light" style="height:44px;font-size:13px" onclick="__darAct(\'verifyReceipt\')">💳 شارجيلي باي (الذهبية / CIB)</button>';
        html += '</div>';
        if (state.botVerifyMsg) {
          html += '<div style="margin-top:10px;background:#064e3b;border:1px solid #10b981;padding:10px;border-radius:12px;font-size:12px;font-weight:800">'+state.botVerifyMsg+'</div>';
        }
        html += '</div>';
        // Register shop form
        html += '<div class="card" style="padding:16px">';
        html += '<h3 style="margin:0 0 10px 0;font-size:16px;font-weight:900">🏪 إضافة محل جديد في واجهة المحلات (15 يوم مجاناً):</h3>';
        html += '<div style="display:grid;gap:10px">';
        html += '<input id="ns_name" class="inp" placeholder="اسم المحل (مثال: معرض الأثاث العصري)" />';
        html += '<select id="ns_wilaya" class="inp"><option value="البليدة">البليدة</option><option value="الجزائر">الجزائر</option><option value="وهران">وهران</option><option value="قسنطينة">قسنطينة</option><option value="سطيف">سطيف</option></select>';
        html += '<input id="ns_phone" class="inp" placeholder="رقم الهاتف والواتساب (مثال: 0798797662)" />';
        html += '<button class="btn btn-gold" style="height:44px;font-size:14px" onclick="__darAct(\'addShop\')">✅ نشر المحل في الواجهة الآن</button>';
        html += '</div></div>';
      }
      else if (state.tab === "chat") {
        html += '<div class="card" style="padding:16px">';
        html += '<h3 style="margin:0 0 10px 0;font-size:16px;font-weight:900">💬 الشات المباشر وروبوت المحل ('+sh.name+')</h3>';
        html += '<div style="background:#FFFBF5;border:1px solid #E8DDD0;border-radius:14px;padding:12px;max-height:320px;overflow-y:auto;margin-bottom:10px">';
        for (var c=0;c<state.chatMsgs.length;c++){
          var cm = state.chatMsgs[c];
          html += '<div style="margin-bottom:8px;padding:10px;border-radius:12px;font-size:13px;font-weight:700;background:'+(cm.from==="bot"?"#FFF3E0":"#2B2117")+';color:'+(cm.from==="bot"?"#2B2117":"#fff")+'">'+cm.text+'</div>';
        }
        html += '</div>';
        html += '<div style="display:flex;gap:8px"><input id="chat_inp" class="inp" placeholder="اكتب رسالتك لصاحب المحل أو أمرك للروبوت..." /><button class="btn btn-gold" onclick="__darAct(\'sendChat\')">إرسال</button></div>';
        html += '</div>';
      }
      else if (state.tab === "admin") {
        html += '<div class="card" style="padding:16px">';
        if (!state.adminLogged) {
          html += '<h3 style="margin:0 0 8px 0;font-size:17px;font-weight:900">🔒 بوابة الإدارة العامة — دار الأثاث</h3>';
          html += '<p style="font-size:12px;color:#6B5A47;font-weight:700;margin-bottom:10px">كلمة السر مخفية ومحمية بالكامل. أدخل كلمة سر الإدارة للدخول:</p>';
          html += '<input id="adm_pw" type="password" class="inp" placeholder="••••••••" style="margin-bottom:10px" />';
          html += '<button class="btn btn-dark" style="width:100%;height:44px" onclick="__darAct(\'adminLogin\')">🔓 دخول لوحة الإدارة</button>';
        } else {
          html += '<h3 style="margin:0 0 10px 0;font-size:17px;font-weight:900;color:#16a34a">✅ لوحة صلاحيات الإدارة الكاملة (أونلاين 24/7 بدون نوم)</h3>';
          html += '<div style="font-size:13px;font-weight:800;margin-bottom:10px">الحساب البريدي الرسمي RIP: <span dir="ltr">'+RIP+'</span> | الهاتف: '+ADMIN_PHONE+'</div>';
          html += '<button class="btn btn-gold" onclick="__darAct(\'verifyReceipt\')">🤖 فحص وصل جديد بالبوت</button>';
        }
        html += '</div>';
      }
      html += '</main>';

      // Bottom Nav
      html += '<nav class="b-bar">';
      var tabs = [
        { id:"home", lbl:"المحلات", ic:"🏪" },
        { id:"wilayas", lbl:"الولايات", ic:"📍" },
        { id:"sijl", lbl:"صاحب المحل", ic:"💳" },
        { id:"chat", lbl:"الشات والروبوت", ic:"🤖" },
        { id:"admin", lbl:"الإدارة", ic:"🛡️" }
      ];
      for (var b=0;b<tabs.length;b++){
        var tb = tabs[b];
        html += '<button class="nav-btn '+(state.tab===tb.id?"act":"")+'" onclick="__darAct(\'tab\',\''+tb.id+'\')"><span>'+tb.ic+'</span><span>'+tb.lbl+'</span></button>';
      }
      html += '</nav>';
      root.innerHTML = html;
    }

    render();

    // Also load full React bundle from local repo ./assets/dar-al-athath.js or live server if online
    function tryMountFullBundle(srcUrl){
      var s = document.createElement("script");
      s.type = "module";
      s.src = srcUrl;
      s.onerror = function(){};
      document.body.appendChild(s);
    }
    fetch("./assets/dar-al-athath.js", { method:"HEAD" }).then(function(r){
      if (r.ok) { tryMountFullBundle("./assets/dar-al-athath.js"); }
      else { tryMountFullBundle("https://clinic-civilian-ipod-rover.trycloudflare.com/api/dar-al-athath/live-bundle.js"); }
    }).catch(function(){
      tryMountFullBundle("https://clinic-civilian-ipod-rover.trycloudflare.com/api/dar-al-athath/live-bundle.js");
    });
  })();
  </script>
</body>
</html>

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:1000;overflow:auto;padding:12px}
.modal.open{display:flex}
.box{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:560px;margin:20px auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.input{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #e8e0d0;background:#fdfaf5;color:#2a2a2a;font-size:13px}

<script>
let shops=JSON.parse(localStorage.getItem('dar_white_real')||'null')||[];
let adminPassword=localStorage.getItem('dar_admin_pass')||'ameurali';
let ribNumber=localStorage.getItem('dar_rib')||'00799999000122089353';
let favorites=JSON.parse(localStorage.getItem('dar_fav')||'[]');
let currentTier='diamond',currentShop=null,currentPay={},currentGlobalChatShop=null;

function saveAll(){localStorage.setItem('dar_white_real',JSON.stringify(shops));localStorage.setItem('dar_admin_pass',adminPassword);localStorage.setItem('dar_rib',ribNumber);localStorage.setItem('dar_fav',JSON.stringify(favorites));}
function initReal(){
 if(shops.length==0){
  for(let i=0;i<20;i++){
   let wils=['ورقلة','مستغانم','أولاد جلال','الطارف','إن قزام','المدية','تيبازة','الجزائر','تبسة','جيجل','المغير','البيض','أولاد جلال','سكيكدة','الطارف','البيض'];
   let wil=wils[i%wils.length];
   let tier=i<2?'diamond':i<5?'gold':i<10?'silver':i<16?'bronze':'free';
   shops.push({id:Date.now()+i,pos:i+1,number:i+1,name:['الأناقة الراقية','الفخامة للأثاث','الراحة الذهبية','بيت العائلة','قصر الأثاث'][i%5]+' - '+wil,trader:'التاجر '+wil,wilaya:wil,tier:tier,hidden:false,code:'DZ-'+(100+i),phone:i%2==0?'0555 12 34 0'+(i%10):'',products:[{name:'طاولة طعام خشب زان',price:80000},{name:'صالون',price:120000}]});
  }
 }
 sortShops();
}
function sortShops(){let order={diamond:0,gold:1,silver:2,bronze:3,free:4}; shops.sort((a,b)=>{let ra=order[a.tier]??4,rb=order[b.tier]??4; if(ra!=rb) return ra-rb; return a.pos-b.pos;}); shops.forEach((s,i)=>s.number=i+1); saveAll();}
function render(){
 let badge=document.getElementById('headerBadge'); let c={diamond:0,gold:0,silver:0,bronze:0,free:0}; shops.forEach(s=>{if(c[s.tier]!=undefined) c[s.tier]++; else c.free++;});
 badge.textContent=`${shops.length} محل • 💎 ${c.diamond} ماسي يحتل الواجهة > 🥇 ${c.gold} ذهبي > 🥈 ${c.silver} فضي تحت الذهبي > 🥉 ${c.bronze} برونزي • 58 ولاية • الصور أولا`;
 document.getElementById('favCount').textContent=favorites.length;
 document.getElementById('ribDisplay').textContent=ribNumber;
 let grid=document.getElementById('grid'); grid.innerHTML=''; let list=shops.filter(s=>!s.hidden);
 if(list.length==0){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999">لا يوجد محل<br><button onclick="openReg()" style="margin-top:12px;background:#b8965f;color:#fff;border:none;border-radius:12px;padding:10px 20px">+ سجل كتاجر</button></div>'; return;}
 list.forEach(s=>{
  let div=document.createElement('div'); div.className='card '+(s.freeTrial&&s.freeUntil&&new Date()<new Date(s.freeUntil)?'free':s.tier);
  let isFree=s.freeTrial&&new Date()<new Date(s.freeUntil); let tierLabel=isFree?`🎁 ${Math.ceil((new Date(s.freeUntil)-new Date())/86400000)} يوم`:s.tier=='diamond'?'💎 ماسي':s.tier=='gold'?'🥇 ذهبي':s.tier=='silver'?'🥈 فضي':'🥉 برونزي';
  div.innerHTML=`<div class="img">🛋️<span class="wil">${s.wilaya}</span><span class="tier ${isFree?'free':s.tier}">${tierLabel}</span></div><div class="meta"><div style="font-size:10px;color:#b8965f">DZ-${100+s.number} • 10 صور أثاث</div><div class="name">${s.name}</div><div style="font-size:10px;color:#999;margin-top:2px">التاجر ${s.trader} • أثاث فاخر بجودة...</div>${s.phone?`<div class="phone">📞 ${s.phone}</div>`:''}<div class="sub"><span>صور أولاً ثم دردشة</span><span>⭐</span></div></div>`;
  div.onclick=()=>openInside(s); grid.appendChild(div);
 });
}
function openInside(s){currentShop=s; document.getElementById('insideTitle').textContent=s.name; document.getElementById('insideInfo').textContent=`${s.code} - ${s.wilaya} - ${s.tier} - #${s.number}${s.phone?' - 📞 '+s.phone:''}`; let g=document.getElementById('prodGrid'); g.innerHTML=''; (s.products||[]).forEach(p=>{let c=document.createElement('div'); c.style.cssText='background:#fdfaf5;border:1px solid #e8dcc8;border-radius:12px;padding:10px;text-align:center'; c.innerHTML=`<div style="font-size:24px">🪑</div><div style="font-size:11px;font-weight:800">${p.name}</div><div style="font-size:11px;color:#b8965f">${p.price.toLocaleString()} دج</div>`; g.appendChild(c);}); document.getElementById('chatBox').style.display='none'; document.getElementById('chatMessages').innerHTML=`<div style="background:#f6f1e8;padding:8px;border-radius:10px">👋 مرحبا! أنا ${s.trader} - ${s.name}</div>`; document.getElementById('insideModal').classList.add('open');}
function doSearch(){let q=document.getElementById('searchInput').value.toLowerCase().trim(); if(!q){shops.forEach(s=>s.hidden=false); render(); return;} shops.forEach(s=>{let t=(s.name+' '+s.wilaya+' '+(s.phone||'')+' '+s.code).toLowerCase(); s.hidden=t.indexOf(q)==-1;}); render();}
function toggleFav(id){let i=favorites.indexOf(id); if(i>=0) favorites.splice(i,1); else favorites.push(id); saveAll(); render();}
function openFav(){if(favorites.length==0){alert('لا يوجد مفضلة'); return;} shops.forEach(s=>s.hidden=favorites.indexOf(s.id)==-1); render();}
function shareCurrent(){if(!currentShop) return; navigator.clipboard.writeText(currentShop.name+' - '+currentShop.wilaya); alert('✅ تم النسخ');}
function mapCurrent(){if(!currentShop) return; window.open('https://www.google.com/maps/search/'+encodeURIComponent(currentShop.wilaya),'_blank');}
function favCurrent(){if(!currentShop) return; toggleFav(currentShop.id);}
function setTier(t){currentTier=t; ['diamond','gold','silver','bronze'].forEach(x=>{let el=document.getElementById('t'+x.charAt(0).toUpperCase()+x.slice(1)); if(el){el.style.borderColor=x==t?'#00e5ff':'#e8dcc8'; el.style.background=x==t?'#e0f7fa':'#fdfaf5';}});}
function publishShop(){let name=document.getElementById('shopName').value.trim(); if(!name){alert('اكتب اسم المحل'); return;} let phone=document.getElementById('shopPhone').value.trim(); let wil=document.getElementById('wilayaSelect').value; let until=new Date(); until.setDate(until.getDate()+15); shops.push({id:Date.now(),pos:999,number:999,name:name+' - '+wil,wilaya:wil,trader:'جديد',tier:'free',hidden:false,code:'DZ-'+(100+shops.length),phone:phone,products:[],freeTrial:true,freeUntil:until}); sortShops(); render(); closeAll(); alert('🎁 تم النشر - 15 يوم مجانا - العدد الآن '+shops.length);}
function openReg(){document.getElementById('regModal').classList.add('open');}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));}
function contactDealer(){if(!currentShop) return; window.location.href='tel:'+(currentShop.phone||'0555123456').replace(/\s/g,'');}
function toggleChat(){let b=document.getElementById('chatBox'); b.style.display=b.style.display=='none'?'block':'none';}
function sendChat(){let inp=document.getElementById('chatInput'); let txt=inp.value.trim(); if(!txt) return; let msgs=document.getElementById('chatMessages'); msgs.innerHTML+='<div style="background:#00e5ff;color:#001015;padding:8px;border-radius:10px;margin:6px 0">أنت: '+txt+'</div>'; inp.value=''; msgs.scrollTop=msgs.scrollHeight; setTimeout(()=>{msgs.innerHTML+='<div style="background:#f6f1e8;padding:8px;border-radius:10px;margin:6px 0">👨‍💼 '+currentShop.trader+': شكرا</div>'; msgs.scrollTop=msgs.scrollHeight;},600);}
function buyPoints(pts,price,tier){currentPay={pts,price,tier}; document.getElementById('ribCopyInput').value=ribNumber; document.getElementById('payTitle').textContent='💳 شراء '+pts+' نقطة - '+tier; document.getElementById('payDetails').innerHTML=`<div>📦 ${pts} نقطة - ${tier}</div><div>💰 <b style="color:#00a5bb;font-size:18px">${price} دج</b></div><div>💳 RIB: ${ribNumber}</div>`; document.getElementById('payModal').classList.add('open');}
function copyRib(){let inp=document.getElementById('ribCopyInput'); inp.select(); try{navigator.clipboard.writeText(inp.value);}catch(e){} document.getElementById('copyMsg').style.display='block'; setTimeout(()=>document.getElementById('copyMsg').style.display='none',2000);}
function openBaridiMob(){window.open('https://baridimob.poste.dz/','_blank');}
function openChargily(){window.open('https://pay.chargily.com/','_blank');}
function openAdminLogin(){document.getElementById('adminLoginModal').classList.add('open');}
function checkAdminLogin(){let p=document.getElementById('adminPassInput').value; if(p==adminPassword){closeAll(); document.getElementById('adminModal').classList.add('open'); renderAdmin();} else alert('❌');}
function renderAdmin(){
 let a=document.getElementById('adminShops'); a.innerHTML='';
 let set=document.createElement('div'); set.style.cssText='background:#fdfaf5;border:1px solid #e8dcc8;border-radius:14px;padding:12px;margin-bottom:12px';
 set.innerHTML=`<div style="font-weight:900">⚙️ إعدادات</div><div style="display:flex;gap:6px;margin-top:6px"><input id="editPass" value="${adminPassword}" class="input" style="margin:0;padding:8px"><button onclick="savePass()" style="background:#00e5ff;border:none;border-radius:8px;padding:8px 12px;font-weight:800">حفظ كلمة السر</button></div><div style="display:flex;gap:6px;margin-top:6px"><input id="editRib" value="${ribNumber}" class="input" style="margin:0;padding:8px;font-family:monospace;color:#00a5bb"><button onclick="saveRib()" style="background:#2ecc71;border:none;border-radius:8px;padding:8px 12px;font-weight:800">حفظ RIB</button></div>`;
 a.appendChild(set);
 shops.forEach((s,i)=>{
  let row=document.createElement('div'); row.style.cssText='background:#fdfaf5;border:1px solid #eee;border-radius:12px;padding:10px;margin-bottom:8px;font-size:11px';
  row.innerHTML=`<div><b>#${s.number} ${s.code}</b> ${s.name} ${s.phone?`📞 ${s.phone}`:''} <b style="color:#b8965f">${s.tier}</b> - ${s.wilaya}</div><div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap"><input id="pos_${i}" type="number" value="${s.number}" min="1" max="${shops.length}" style="width:50px;padding:4px;border-radius:8px;border:1px solid #e8dcc8"><button onclick="moveTo(${i})" style="background:#00e5ff;border:none;border-radius:8px;padding:6px 10px">نقل</button><button onclick="setTierAdmin(${i},'diamond')" style="background:#00e5ff;border:none;border-radius:8px;padding:6px 8px">💎</button><button onclick="setTierAdmin(${i},'gold')" style="background:#b8965f;color:#fff;border:none;border-radius:8px;padding:6px 8px">🥇</button><button onclick="setTierAdmin(${i},'silver')" style="background:#aaa;color:#fff;border:none;border-radius:8px;padding:6px 8px">🥈</button><button onclick="setTierAdmin(${i},'bronze')" style="background:#cd7f32;color:#fff;border:none;border-radius:8px;padding:6px 8px">🥉</button><button onclick="chatShop(${i})" style="background:#00e5ff;border:none;border-radius:8px;padding:6px 8px">💬</button><button onclick="deleteShop(${i})" style="background:#ffdddd;color:#c00;border:none;border-radius:8px;padding:6px 8px">🗑️</button></div>`;
  a.appendChild(row);
 });
}
function savePass(){let v=document.getElementById('editPass').value.trim(); if(v){adminPassword=v; saveAll(); alert('✅ حفظ');}}
function saveRib(){let v=document.getElementById('editRib').value.trim(); if(v){ribNumber=v; saveAll(); document.getElementById('ribDisplay').textContent=v; alert('✅ حفظ RIB');}}
function moveTo(i){let np=parseInt(document.getElementById('pos_'+i).value); if(!np) return; let s=shops.splice(i,1)[0]; shops.splice(np-1,0,s); shops.forEach((x,idx)=>x.pos=idx+1); sortShops(); render(); renderAdmin();}
function setTierAdmin(i,t){shops[i].tier=t; shops[i].freeTrial=false; sortShops(); render(); renderAdmin();}
function deleteShop(i){if(confirm('حذف؟')){shops.splice(i,1); sortShops(); render(); renderAdmin();}}
function chatShop(i){closeAll(); openGlobalChat(); document.getElementById('chatShopSelect').selectedIndex=i; startChatWithSelected();}
function openGlobalChat(){let sel=document.getElementById('chatShopSelect'); sel.innerHTML=''; shops.forEach((s,i)=>{let o=document.createElement('option'); o.value=i; o.textContent='#'+s.number+' '+s.name+(s.phone?' 📞 '+s.phone:''); sel.appendChild(o);}); document.getElementById('globalChatBox').style.display='none'; document.getElementById('chatModal').classList.add('open');}
function startChatWithSelected(){let idx=parseInt(document.getElementById('chatShopSelect').value); if(isNaN(idx)) return; currentGlobalChatShop=shops[idx]; document.getElementById('globalChatTitle').textContent='💬 شات مع '+currentGlobalChatShop.name; document.getElementById('globalChatMessages').innerHTML='<div style="background:#f6f1e8;padding:8px;border-radius:10px">👋 مرحبا! أنا '+currentGlobalChatShop.trader+'</div>'; document.getElementById('globalChatBox').style.display='block';}
function sendGlobalChat(){let inp=document.getElementById('globalChatInput'); let txt=inp.value.trim(); if(!txt||!currentGlobalChatShop) return; let msgs=document.getElementById('globalChatMessages'); msgs.innerHTML+='<div style="background:#00e5ff;color:#001015;padding:8px;border-radius:10px;margin:6px 0">أنت: '+txt+'</div>'; inp.value=''; msgs.scrollTop=msgs.scrollHeight;}
function callFromChat(){if(!currentGlobalChatShop) return; window.location.href='tel:'+(currentGlobalChatShop.phone||'').replace(/\s/g,'');}
function openWilayas(){let wilayas=['ورقلة','الجزائر','وهران','قسنطينة','مستغانم','باتنة','بجاية','عنابة','البليدة']; let grid=document.getElementById('wilayasGrid'); grid.innerHTML=''; wilayas.forEach(w=>{let b=document.createElement('button'); b.style.cssText='padding:10px;border-radius:12px;border:1px solid #e8dcc8;background:#fdfaf5'; b.textContent=w+' ('+shops.filter(s=>s.wilaya==w).length+')'; b.onclick=()=>{shops.forEach(s=>s.hidden=s.wilaya!=w); render(); closeAll();}; grid.appendChild(b);}); let all=document.createElement('button'); all.style.cssText='grid-column:1/-1;padding:10px;border-radius:12px;border:2px solid #b8965f;background:#fff;color:#b8965f'; all.textContent='كل الولايات - '+shops.length; all.onclick=()=>{shops.forEach(s=>s.hidden=false); render(); closeAll();}; grid.appendChild(all); document.getElementById('wilayasModal').classList.add('open');}
function openHistory(){document.getElementById('botModal').classList.add('open');}
function execBot(){let raw=document.getElementById('botCmd').value.trim(); if(!raw) return; document.getElementById('botLog').innerHTML+='<div>'+raw+'</div>';}
window.onload=function(){initReal(); render(); setTier('diamond'); document.getElementById('botLog').innerHTML='<div>✅ V18 WHITE REAL - أونلاين</div>';};
</script>
</body>
</html>

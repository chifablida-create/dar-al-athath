div style="font-size:11px;color:#666;margin-top:6px">البوت يسجل كل المحادثات - يمكنك الحذف متى تشاء - أمر البوت: احذف محادثات الأمس</div>
</div>

<div class="section" id="sec-settings">
<h4>⚙️ إعدادات التطبيق</h4>
<div style="display:grid;gap:10px">
<div style="border:1px solid #eee;border-radius:12px;padding:12px"><b>🎨 الألوان والإضاءة</b><br><label style="font-size:12px">نسبة الأبيض: <input type="range" value="70"> 70% (رائعة + أضواء بيضاء)</label></div>
<div style="border:1px solid #eee;border-radius:12px;padding:12px"><b>💰 بريدي موب RIP</b><br><input class="input" placeholder="أدخل RIP الصحيح هنا - الحقل فارغ بحدود حمراء" style="border-color:red"><button class="btn gold" style="width:auto">حفظ RIP</button></div>
<div style="border:1px solid #eee;border-radius:12px;padding:12px"><b>📋 السجل</b><br><label><input type="checkbox" checked> تفعيل تسجيل الزوار 👁️</label><br><label><input type="checkbox" checked> تفعيل النجوم ⭐ ومنع التكرار</label><br><label><input type="checkbox" checked> تسجيل محادثات البوت وحذفها متى تشاء</label></div>
<div style="border:1px solid #eee;border-radius:12px;padding:12px"><b>🤖 البوت</b><br><label><input type="checkbox" checked> تفعيل البوت العام</label> - زر تشغيل/إيقاف<br><input class="input" placeholder="رسالة ترحيب البوت"></div>
<div style="border:1px solid #eee;border-radius:12px;padding:12px"><b>🗺️ الولايات</b><br>58 ولاية كاملة 01-58 <button class="btn" style="width:auto;padding:6px">فحص</button></div>
<div style="border:1px solid #eee;border-radius:12px;padding:12px"><b>🔐 كود الإدارة</b><br><input class="input" placeholder="ameurali - مشفر" style="width:60%"><button class="btn" style="width:auto">تغيير</button></div>
</div>
</div>

<div class="section" id="sec-shops"><div style="display:flex;justify-content:space-between"><h4>🔄 ترتيب المحلات في الواجهة</h4><button class="btn gold" onclick="saveOrder()">💾 حفظ</button></div><div id="adminShops" style="margin-top:8px;border:1px solid #eee;border-radius:12px;max-height:340px;overflow:auto"></div></div>

</div></div></div>

<script>
let shops=[];for(let i=1;i<=20;i++){shops.push({id:1000+i,pos:i,name:`محل ${i} - ${['الراقي','الحديث','الجزائري','العصري'][i%4]}`,price:25000+i*1300,wilaya:[16,31,25][i%4],hidden:false,featured:i===1})}
function render(){let g=document.getElementById('grid');g.innerHTML='';shops.filter(s=>!s.hidden).forEach((s,idx)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="img">${['🛋️','🪑','🛏️','🍽️'][idx%4]}</div><div class="meta"><div style="font-size:13px;font-weight:700">${s.name}</div><div><span class="price">${s.price} دج</span> <span class="w">${s.wilaya}</span></div><div style="font-size:11px;color:#999">👁️ ${120+idx*3} ⭐ ${(4+Math.random()).toFixed(1)} • مرتبة ${s.pos}</div></div>`;d.onclick=()=>alert('سجل أولاً لرؤية المحل - واجهة التسجيل');g.appendChild(d);});renderAdmin();}
function renderAdmin(){let a=document.getElementById('adminShops');if(!a) return;a.innerHTML='';shops.forEach((s,i)=>{let r=document.createElement('div');r.style.cssText='display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #f5f5f5;font-size:12px';r.innerHTML=`<span>#${s.id} - ${s.name} - مرتبة ${s.pos} ${s.featured?'⭐':''} ${s.hidden?'مخفي':''}</span><span><button onclick="move(${i},-1)">↥</button><button onclick="move(${i},1)">↧</button><button onclick="toggleHide(${i})">👁️</button></span>`;a.appendChild(r);});}
function move(i,dir){let ni=i+dir;if(ni<0||ni>=shops.length) return;[shops[i],shops[ni]]=[shops[ni],shops[i]];shops.forEach((s,idx)=>s.pos=idx+1);render();log(`تم تحويل إلى ${ni+1}`);}
function toggleHide(i){shops[i].hidden=!shops[i].hidden;render();}
let clicks=0,last=0,tries=0,hashed="YW1ldXJhbGk=";
document.getElementById('logo').addEventListener('click',()=>{let n=Date.now();if(n-last>3000) clicks=0;clicks++;last=n;if(clicks>=5){clicks=0;document.getElementById('adminLogin').classList.add('show')}});
function tryAdmin(){let v=document.getElementById('ap').value.trim();if(btoa(v.toLowerCase())===hashed){document.getElementById('adminLogin').classList.remove('show');document.getElementById('adminPanel').classList.add('show');tries=0;log('✅ دخول - مرحبا ameurali - الإدارة الكاملة جاهزة');}else{tries++;document.getElementById('tr').textContent=tries+'/5';document.getElementById('ae').textContent=tries>=2?'غير صحيحة • تلميح: اسمك':'كلمة السر غير صحيحة';}}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'))}
function switchTab(id){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('sec-'+id).classList.add('active');event.target.classList.add('active');}
function setCmd(t){document.getElementById('botCmd').value=t}
function log(t){let l=document.getElementById('botLog');let time=new Date().toLocaleTimeString('ar-DZ');l.innerHTML+=`<div>[${time}] ${t}</div>`;l.scrollTop=l.scrollHeight}
function execBot(){let cmd=document.getElementById('botCmd').value.trim();let m=cmd.match(/محل\s*(\d+)\s*إلى\s*(\d+)/);if(m){let f=parseInt(m[1]),t=parseInt(m[2]);let idx=shops.findIndex(s=>s.pos===f);if(idx>=0){let it=shops.splice(idx,1)[0];shops.splice(t-1,0,it);shops.forEach((s,i)=>s.pos=i+1);render();log(`✅ تم تحويل محل ${f} → ${t} في الواجهة`);}else log(`❌ محل ${f} غير موجود`);}else if(cmd.includes('ثبت')){let n=parseInt((cmd.match(/محل\s*(\d+)/)||[])[1]);let i=shops.findIndex(s=>s.pos===n);if(i>=0){let it=shops.splice(i,1)[0];it.featured=true;shops.unshift(it);shops.forEach((s,i)=>s.pos=i+1);render();log(`⭐ ثبت محل ${n} في الأعلى`);}}else if(cmd.includes('أخف')||cmd.includes('اخف')){let n=parseInt((cmd.match(/محل\s*(\d+)/)||[])[1]);let i=shops.findIndex(s=>s.pos===n);if(i>=0){shops[i].hidden=true;render();log(`👁️‍🗨️ أخفيت محل ${n}`);}}else if(cmd.includes('أظهر')||cmd.includes('اظهر')||cmd.includes('كل')){shops.forEach(s=>s.hidden=false);render();log(`👁️ أظهرت كل المحلات`);}else if(cmd.includes('احذف')&&cmd.includes('محادثات')){log(`🗑️ تم حذف محادثات الأمس - السجل`);}else if(cmd.includes('RIP')||cmd.includes('بريدي')){log(`💳 RIP: الحقل فارغ بانتظار الرقم الصحيح - اذهب لإعدادات التطبيق`);}else log(`❌ لم أفهم: ${cmd}`);}
function startVoice(){log('🎤 استماع...');setTimeout(()=>{setCmd('حول محل 5 إلى 20');log('تم التعرف: حول محل 5 إلى 20')},1000)}
function saveOrder(){log('💾 حفظ ترتيب المحلات - الواجهة تحدثت');}
render();
</script>
</body>
</html>
